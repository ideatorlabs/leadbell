[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "leadbell"
version = "0.1.0"
description = "Website lead capture and business-event alerts for small SaaS teams: consent-checked, spam-resistant demo requests and one tidy card per sign-up, lead or payment in Discord, Slack or any webhook."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ideator Labs", email = "ideatorlabs.ai@gmail.com" }]
keywords = ["leads", "lead-capture", "sign-up", "utm", "consent", "discord", "slack", "webhook", "fastapi", "saas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "python-multipart>=0.0.9"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "fastapi>=0.100",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ideatorlabs/leadbell"
Repository = "https://github.com/ideatorlabs/leadbell"
Issues = "https://github.com/ideatorlabs/leadbell/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/leadbell"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["leadbell"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:leadbell.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["leadbell"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
